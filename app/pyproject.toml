[project]
name = "family-brief"
version = "0.7.1"
description = "Daily aggregator for kid-related messages across Gmail, Wilma, WhatsApp, MyClub"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "icalendar>=5.0",
    "requests>=2.32",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "tzdata",
    "json-repair>=0.25",
]

[project.optional-dependencies]
# Only the Google Calendar mode uses these. install.sh adds them when the config's calendar mode
# is google (family_brief/google_packages.py).
google = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
test = [
    "pytest>=8",
    "pytest-cov>=7",
    "time-machine>=2.14",
    # Drives the setup page in a real browser (ADR 0024). Its Chromium is a separate download:
    # python -m playwright install --only-shell chromium
    "playwright>=1.50",
]

[project.scripts]
family-brief = "family_brief.__main__:main"
parent-recap = "family_brief.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"family_brief" = ["page/*", "pilot_feedback.yaml", "sensitive_words.yaml"]
"family_brief.eval" = ["cases/*.yaml", "prices.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers"
# Seen only when Python runs with PYTHONWARNDEFAULTENCODING=1, as CI does (.github/workflows/tests.yml).
filterwarnings = ["error::EncodingWarning:family_brief"]
markers = [
    # The layers (tests/README.md), set from a test's folder by conftest.py, not by hand.
    "unit: a pure function, nothing faked",
    "integration: one module through its interface, with in-memory fakes",
    "e2e: main() or the setup page over HTTP, faked only at the OS and network edge",
    "adapters: an OS adapter against the real OS, the _windows twins among them",
    "scripts: install.sh, install.ps1, release.py, issue-loop.sh and the workflows",
    "macos: needs macOS (a macOS adapter, a macOS-only feature, or what Windows can't do yet); skipped elsewhere",
    "windows: needs Windows (a Windows adapter or Windows' own layout); skipped elsewhere",
    "browser: drives the setup page in a real browser with Playwright; skipped without its Chromium",
]

# Used only with `pytest --cov`, as CI's macOS job runs it. No fail_under: the numbers inform, they
# don't gate (#403).
[tool.coverage.run]
source = ["family_brief"]
branch = true
