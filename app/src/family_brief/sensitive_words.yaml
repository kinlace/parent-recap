# Words that make a message look sensitive. While the AI filter is on, the evening Brief holds such
# a message back from the AI and lists it by Source, sender and subject, so the parents read it
# where it came from (ADR 0013, held_back.py). The check runs on the Mac and never asks the AI.
#
# REVIEW: the Finnish list waits for a native speaker's review. The Swedish, English and Chinese
# lists wait for review by the maintainers. Changing a word here changes which messages the AI
# never sees, so tests/test_held_back.py lists the cases that must and must not be held back.
#
# What the lists aim at: a message about one person's sensitive situation, such as a diagnosis, a
# meeting with a psychologist or a school social worker (kuraattori), special or intensified
# support, bullying, harassment, violence, child welfare or the police. This includes messages
# about the Household's own Kids. A held-back message loses its summary and Action Items, so
# routine school messages must still reach the AI: head lice, chickenpox, a sick-day absence, the
# school nurse's check-up schedule, a sports injury in a club chat, a camp notice that asks about
# medication, a diagnostic test in maths, the school subject psychology, the guidance counsellor's
# course choices, and a newsletter whose footer lists the staff. So these words are left out on
# purpose: sick, ill, fever, nurse, doctor, check-up, lice, chickenpox, allergy, injury, hospital
# and medication (sairas, kipeä, terveydenhoitaja, lääkäri, terveystarkastus, täi, vesirokko,
# allergia, loukkaantui, sairaala, lääkitys, lääke, medicinering, 用药, 服药, and the like). The
# word lists can't tell a notice to the whole school from a message about one child, so the Sources
# do: a Wilma announcement, a Wilma message that names 15 or more recipients, the announcements in
# Wilma's notification emails and an email to a mailing list are sent to everyone and never held
# back (held_back.sent_to_everyone). A message to the Household with a word here is held back even
# when a teacher sent it to the whole class, if Wilma hides who it went to, such as a Wilma
# message about a talk on bullying or a police visit about traffic safety.
#
# How an entry matches:
# - Case doesn't matter, and every list is checked against the subject, the body and the sender's
#   name of every message, whatever language it is in.
# - An entry is the start of a word, a stem, and it counts anywhere inside a word too. One stem
#   covers the Finnish and Swedish case endings and compounds: kiusa finds kiusattu, kiusasi,
#   kiusaamista and koulukiusaaminen, and mobb finds mobbad and nätmobbning. Chinese has no spaces
#   between words, so a Chinese entry counts wherever it stands, also right next to other text.
# - A word that ends in . must end there: "diagnos." finds the Swedish diagnos but not diagnostiska
#   prov (diagnostic tests).
# - An entry with a space is stems in a row, each a word of its own, and a word may list its forms
#   with |: "tehostet tuki|tukea|tue" finds tehostettu tuki, tehostettua tukea and tehostetun tuen,
#   but not erityisen tukevat kengät (especially sturdy shoes).
# - Text that matches an entry under `not` is taken out before the check, for words that hold a
#   stem but mean something else: kiusallinen (awkward) is not kiusaaminen, fysioterapia after a
#   sports injury is not terapia, and psykologian koe (the psychology exam) is not a psychologist.
# - The `staff` list counts only on a line without a phone number, an email address or a link, as
#   the AI filter finds them: "Kuraattori Maija Laine, 040 123 4567" in a newsletter's footer is a
#   contact, not a meeting. The other lists count on any line.
# - A stem needs enough letters not to turn up in everyday words: abus would find syllabus, so the
#   English list has abuse and abusi. Support is matched by its pairs (erityinen tuki), since tuki
#   alone would find tukiopetus and tukikohta.
#
# Categories: health (diagnoses, conditions and therapy), support (special or intensified support
# and individual plans), bullying (bullying, harassment and violence), welfare (child welfare and
# the police) and staff (psychologists, school social workers and other staff or services a family
# meets about one child). The Brief doesn't show them. They are for reviewing the lists and the log.
# To see which words hold back which messages in a Household's archive, the parent runs
# `parent-recap ai-filter-report --held-back`, which opens the list in TextEdit.

