# A week of the demo Household's news (#1029), from each Source the Brief covers: what each
# Source's collector would have given the evening run. Every name, school, club, daycare,
# address and phone number is invented.
#
# When things happen is counted from the evening the demo runs, so the week is always this one:
# `day` is a number of days (-1 yesterday, 0 today, 2 the day after tomorrow) or of weekdays,
# Monday to Friday, with a `w` (-1w the last weekday before today, 3w the third one after it).
# In a text, {+3w} is that day as a Finnish message writes it ("to 27.11.") and {en:+3w} as an
# English one does ("Thu 27 Nov"). A time is in the Household's zone.
#
# One message, the school's email about a pedagogical assessment, has words that make it look
# sensitive (sensitive_words.yaml): it is held back from the AI and listed by the Brief itself.

messages:
  # ── Wilma
  - source: wilma
    id: demo-wilma-exam
    day: -3w
    time: "15:20"
    sender: Opettaja Laura Niemi
    subject: Matematiikan koe
    chat: Viestit
    kid: Ella
    metadata: {wilma_kind: message}
    body: |
      Hei 2B:n huoltajat!
      Matematiikan koe on {+2w} ensimmäisellä tunnilla. Kokeessa on kertotaulut 2–5 ja kellonajat.
      Harjoitelkaa kotona kirjan sivuja 48–53. Kertotaulupelit löytyvät myös oppimisalustalta.
      Ystävällisin terveisin, Laura Niemi
  - source: wilma
    id: demo-wilma-bring
    day: -1w
    time: "13:45"
    sender: Opettaja Laura Niemi
    subject: Uintia liikuntatunnilla
    chat: Viestit
    kid: Ella
    metadata: {wilma_kind: message}
    body: |
      Hei!
      Liikuntatunnilla {+3w} menemme uimahalliin. Lapsella pitää olla mukana uimapuku tai
      uimahousut, pyyhe ja uimalakki. Jos lapsi ei voi uida, kertokaa minulle viimeistään {+2w},
      niin sovitaan hänelle muuta tekemistä.
      Laura
  - source: wilma
    id: demo-wilma-schedule
    day: -2w
    time: "09:10"
    sender: Rehtori Markku Salo
    subject: Muutos koulupäivän alkuun
    chat: Tiedotteet
    metadata: {wilma_kind: news}
    body: |
      Hyvät huoltajat,
      opettajien koulutuspäivän vuoksi koulu alkaa {+1w} kaikilla luokilla vasta klo 10.00.
      Aamupäiväkerho on auki normaalisti klo 7.30 alkaen niille, jotka ovat siihen ilmoittautuneet.
      Koululounas syödään tavalliseen aikaan.
      Markku Salo, rehtori, Kuusikallion koulu
  - source: wilma
    id: demo-wilma-answer
    day: 0
    time: "11:30"
    sender: Opettaja Laura Niemi
    subject: Retki Planetaarioon – vastaathan
    chat: Viestit
    kid: Ella
    metadata: {wilma_kind: message}
    body: |
      Hei!
      Lähdemme koko luokan kanssa tiederetkelle Planetaarioon {+5w} klo 9–13. Retki on maksuton.
      Vastaattehan tähän viestiin viimeistään {+2w}, saako Ella osallistua, ja onko hänellä
      ruoka-aineallergioita, jotka meidän pitää huomioida eväissä.
      Kiitos! Laura

  # ── School email
  - source: gmail
    id: "7300000000000000101"
    day: -4w
    time: "16:00"
    sender: Kuusikallion koulu <tiedotus@kuusikallio.example.fi>
    subject: Kuukauden tiedote
    metadata: {mailing_list: true}
    body: |
      Hyvät Kuusikallion koulun perheet,

      Tämän kuun tärkeimmät asiat:
      - Luokkakuvat otetaan {+4w} aamupäivällä. Kuvat voi tilata verkosta kahden viikon ajan.
      - Löytötavarat ovat esillä aulassa {+6w} asti. Sen jälkeen ne viedään kierrätykseen.
      - Vanhempainyhdistyksen myyjäiset pidetään koulun salissa {+8w} klo 17–19. Leivonnaisia
        otetaan vastaan kanttiinissa samana päivänä.

      Mukavaa kuukautta toivottaen,
      Kuusikallion koulun väki
  - source: gmail
    id: "7300000000000000102"
    day: -1w
    time: "18:12"
    sender: Iltapäiväkerho Tähti <tahti@kuusikallio.example.fi>
    subject: Iltapäiväkerhon laskut ja loma-ajan hoito
    body: |
      Hei!
      Seuraavan kuun laskut lähtevät ensi viikolla. Ilmoittakaa {+4w} mennessä, tarvitseeko
      lapsenne hoitoa seuraavan loman ensimmäisellä viikolla. Ilmoittautuminen tehdään
      vastaamalla tähän viestiin.
      Terveisin, kerho-ohjaaja Sanna
  - source: gmail
    id: "7300000000000000103"
    day: -1
    time: "10:40"
    sender: Erityisopettaja Hanna Lehto <hanna.lehto@kuusikallio.example.fi>
    subject: Ellan lukemisen tukeminen
    body: |
      Hei,
      Ellan pedagoginen arvio on nyt valmis. Ehdottaisin, että käymme sen yhdessä läpi
      tapaamisessa ensi viikolla. Sopisiko teille jokin iltapäivä?
      Ystävällisin terveisin, Hanna Lehto

