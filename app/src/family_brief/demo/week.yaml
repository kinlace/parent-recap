      {weekday+6} {date+6} klo 17.30? Vartin voi pitää koululla tai puhelimessa.
      Vastatkaa tähän viestiin viimeistään {date+2}, niin vahvistan ajan.
      Sanna

  - source: wilma
    id: "exam:demo-yo-1"
    day: 0
    time: "06:00"
    subject: "Exam: Ympäristöoppi – Vesi ja sää"
