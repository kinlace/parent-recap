# One week of the demo's Household (household.yaml), as its Sources would give it to the evening
# run: Wilma, the school's email, two WhatsApp groups, MyClub, eVaka and Eepos. Everything here is
# made up. `parent-recap demo` reads it the evening it runs, so its dates move with that evening:
#
#   day: the school day the message came, or the event is on, counted from the evening of the
#        demo, which is day 0: -1 is the school day before, 2 the second school day after. A
#        weekend is skipped, so school is never on a Saturday.
#   time: when, in Finnish time. A message of day 0 later than the demo runs is moved to just
#        before it.
#   In a message's text, {date+N} is day N's date as Finns write it (24.11.), {weekday+N} its
#   weekday in Finnish (tiistai), {iso+N} as 2026-11-24, {dow+N} as Tue, and {in+N} how far ahead
#   it is, as Wilma's exams say it (tomorrow, in 3 days).
#
# A WhatsApp message's Kid and whether its group is summed up come from household.yaml, as the
# Source takes them from the config. The email from the special education teacher looks
# sensitive, so the AI never sees it and the Brief lists it by itself (ADR 0013).

messages:
  # ── Wilma
  - source: wilma
    id: "message:4101"
    day: -3
    time: "13:20"
    sender: Lehtonen Sanna
    subject: Metsäretki
    kid: Ella
    metadata: {wilma_kind: message, addressee_count: 24}
    body: |
      Hei 2B:n huoltajat!
      Lähdemme {weekday+4}na {date+4} metsäretkelle Kivikummun luontopolulle. Lähdemme koululta klo 9.00 ja
      palaamme ennen klo 13.00. Mukaan eväät, juomapullo ja säänmukaiset vaatteet.
      Täyttäkää retkilupa Wilman lomakkeella viimeistään {date+2}.
      Terveisin Sanna Lehtonen

