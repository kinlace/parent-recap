  - source: whatsapp
    id: demo-wa-2b-5
    day: 0
    time: "17:20"
    sender: Mari (Veetin äiti)
    chat: 2B vanhemmat
    kid: Ella
    metadata: {from_me: false, digest: true}
    body: |
      Illanvieton tarjoilulista, kirjoittakaa nimenne perään:
      - keksejä
