<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Parent Recap</title>
<link rel="stylesheet" href="page.css">
<script src="page.js" defer></script>
</head>
<body>
<header>
  <span class="product">Parent Recap</span>
  <label class="switch">
    <span class="hidden-label" data-text="language.label"></span>
    <select id="language-switch"></select>
  </label>
</header>
<main>
  <section id="language" hidden>
    <h1 data-text="language.question"></h1>
    <p class="note" data-text="language.note"></p>
    <form id="language-form">
      <fieldset id="language-choices"></fieldset>
      <button type="submit" data-text="continue"></button>
    </form>
  </section>
  <ol id="phases" class="phases" hidden></ol>
  <section id="welcome" hidden>
    <h1 data-text="welcome.title"></h1>
    <p class="note" data-text="welcome.intro"></p>
    <form id="welcome-form">
      <fieldset>
        <legend data-text="welcome.ai"></legend>
        <label><input type="radio" name="ai" value="claude"><span data-text="welcome.ai.claude"></span></label>
        <label><input type="radio" name="ai" value="codex"><span data-text="welcome.ai.codex"></span></label>
        <p class="hint" data-text="welcome.ai.plan"></p>
        <div id="ai-status" class="status" role="status">
          <p id="ai-message"></p>
          <div id="ai-install" class="install" hidden>
            <code id="ai-install-line"></code>
            <button type="button" id="ai-copy" class="secondary" data-text="copy"></button>
          </div>
          <button type="button" id="ai-again" class="secondary" data-text="welcome.ai.again" hidden></button>
        </div>
      </fieldset>
      <fieldset>
        <legend data-text="welcome.partner"></legend>
        <label><input type="radio" name="partner" value="add"><span data-text="welcome.partner.add"></span></label>
        <label><input type="radio" name="partner" value="only-me"><span data-text="welcome.partner.only-me"></span></label>
        <div id="partner-details" class="details">
          <div class="field">
            <label for="partner-address" data-text="welcome.partner.address"></label>
            <input type="email" id="partner-address" autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label for="partner-language" data-text="welcome.partner.language"></label>
            <select id="partner-language"></select>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend data-text="welcome.feedback"></legend>
        <label><input type="radio" name="feedback" value="yes"><span data-text="welcome.feedback.yes"></span></label>
        <label><input type="radio" name="feedback" value="no"><span data-text="welcome.feedback.no"></span></label>
        <p class="hint" data-text="welcome.feedback.note"></p>
      </fieldset>
      <h2 data-text="welcome.next"></h2>
      <p data-text="welcome.sources"></p>
      <p class="ready" data-text="welcome.wilma"></p>
      <button type="submit" id="welcome-continue" data-text="continue"></button>
    </form>
  </section>
  <section id="connect" hidden>
    <h1 data-text="connect.title"></h1>
    <p class="note" data-text="connect.intro"></p>
    <ol id="sources" class="sources"></ol>
    <div id="source-wilma" class="source" hidden>
      <h2 data-text="source.wilma"></h2>
      <fieldset>
        <legend data-text="wilma.uses"></legend>
        <label><input type="radio" name="wilma-uses" value="yes" checked><span data-text="wilma.uses.yes"></span></label>
        <label><input type="radio" name="wilma-uses" value="no"><span data-text="wilma.uses.no"></span></label>
      </fieldset>
      <div class="field">
        <label for="wilma-search" data-text="wilma.search"></label>
        <input type="search" id="wilma-search" autocomplete="off" spellcheck="false" disabled>
        <p class="hint" data-text="wilma.search.hint"></p>
      </div>
      <fieldset id="wilma-towns" class="towns"></fieldset>
      <p id="wilma-none" class="hint" data-text="wilma.none-found" hidden></p>
      <form id="wilma-form" class="details">
        <div class="field">
          <label for="wilma-username" data-text="wilma.username"></label>
          <input type="text" id="wilma-username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="wilma-password" data-text="wilma.password"></label>
          <input type="password" id="wilma-password" name="password" autocomplete="current-password" required>
        </div>
        <p class="hint" data-text="wilma.fill"></p>
        <div class="actions">
          <button type="submit" id="wilma-sign-in" data-text="wilma.sign-in"></button>
          <button type="button" id="wilma-passwords" class="secondary" data-text="wilma.passwords"></button>
        </div>
      </form>
      <form id="town-form" class="details" hidden>
        <p class="hint" data-text="wilma.town.note"></p>
        <div class="actions">
          <button type="submit" id="town-save" data-text="wilma.town.save"></button>
        </div>
      </form>
    </div>
    <div id="source-gmail" class="source" hidden>
      <h2 data-text="source.gmail"></h2>
      <p data-text="gmail.explain"></p>
      <p><button type="button" id="gmail-open" class="secondary" data-text="gmail.open"></button></p>
      <form id="gmail-form" class="details">
        <div class="field">
          <label for="gmail-address" data-text="gmail.address"></label>
          <input type="email" id="gmail-address" autocomplete="email" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="gmail-password" data-text="gmail.password"></label>
          <input type="password" id="gmail-password" autocomplete="off" spellcheck="false" required>
        </div>
        <div class="actions">
          <button type="submit" id="gmail-save" data-text="gmail.save"></button>
          <button type="button" id="gmail-unavailable" class="link" data-text="gmail.unavailable"></button>
        </div>
      </form>
    </div>
    <div id="source-ai" class="source" hidden>
      <h2 data-text="source.ai"></h2>
      <div id="ai-claude" hidden>
        <p data-text="claude.explain"></p>
        <p><button type="button" id="claude-start" data-text="claude.start"></button></p>
        <form id="claude-form" class="details" hidden>
          <p class="hint" data-text="claude.paste"></p>
          <div class="field">
            <label for="claude-token" data-text="claude.token"></label>
            <input type="password" id="claude-token" autocomplete="off" spellcheck="false" required>
          </div>
          <div class="actions">
            <button type="submit" id="claude-save" data-text="claude.save"></button>
          </div>
        </form>
      </div>
      <div id="ai-codex" hidden>
        <p data-text="codex.explain"></p>
        <p><button type="button" id="codex-login" data-text="codex.login" hidden></button></p>
      </div>
    </div>
    <div id="source-whatsapp" class="source" hidden>
      <h2 data-text="source.whatsapp"></h2>
      <p data-text="whatsapp.explain"></p>
      <p><button type="button" id="whatsapp-open" data-text="whatsapp.open"></button></p>
      <div class="pictures">
        <figure>
          <svg viewBox="0 0 240 150" role="img" aria-hidden="true">
            <rect x="4" y="18" width="104" height="112" rx="6" fill="#fff" stroke="#c9c9cf"/>
            <rect x="4" y="18" width="104" height="16" rx="6" fill="#ececf0"/>
            <rect x="16" y="56" width="80" height="16" rx="3" fill="#2f6fde"/>
            <text x="22" y="68" font-size="10" fill="#fff">python3</text>
            <rect x="16" y="80" width="80" height="10" rx="3" fill="#ececf0"/>
            <rect x="16" y="96" width="80" height="10" rx="3" fill="#ececf0"/>
            <rect x="132" y="18" width="104" height="112" rx="6" fill="#fff" stroke="#c9c9cf"/>
            <rect x="132" y="18" width="104" height="16" rx="6" fill="#ececf0"/>
            <rect x="142" y="48" width="84" height="56" rx="4" fill="#f5f5f7" stroke="#c9c9cf" stroke-dasharray="4 3"/>
            <path d="M96 64 C 118 64, 124 76, 150 76" fill="none" stroke="#2f6fde" stroke-width="3"/>
            <path d="M150 76 l-9 -6 l0 12 z" fill="#2f6fde"/>
          </svg>
          <figcaption data-text="whatsapp.picture.drag"></figcaption>
        </figure>
        <figure>
          <svg viewBox="0 0 240 150" role="img" aria-hidden="true">
            <rect x="4" y="18" width="232" height="112" rx="6" fill="#fff" stroke="#c9c9cf"/>
            <rect x="4" y="18" width="232" height="16" rx="6" fill="#ececf0"/>
            <rect x="20" y="52" width="200" height="22" rx="4" fill="#f5f5f7"/>
            <text x="30" y="67" font-size="11" fill="#1d1d1f">python3</text>
            <rect x="178" y="56" width="30" height="14" rx="7" fill="#2f6fde"/>
            <circle cx="201" cy="63" r="5.5" fill="#fff"/>
            <rect x="20" y="82" width="200" height="22" rx="4" fill="#f5f5f7"/>
            <rect x="30" y="90" width="70" height="7" rx="3" fill="#d8d8de"/>
            <rect x="178" y="86" width="30" height="14" rx="7" fill="#d8d8de"/>
            <circle cx="185" cy="93" r="5.5" fill="#fff"/>
            <circle cx="193" cy="63" r="22" fill="none" stroke="#e8590c" stroke-width="2.5"/>
          </svg>
          <figcaption data-text="whatsapp.picture.switch"></figcaption>
        </figure>
        <figure>
          <svg viewBox="0 0 240 150" role="img" aria-hidden="true">
            <rect x="40" y="14" width="160" height="122" rx="10" fill="#fff" stroke="#c9c9cf"/>
            <rect x="104" y="26" width="32" height="32" rx="7" fill="#ececf0"/>
            <rect x="62" y="68" width="116" height="7" rx="3" fill="#d8d8de"/>
            <rect x="76" y="80" width="88" height="7" rx="3" fill="#d8d8de"/>
            <rect x="52" y="100" width="64" height="22" rx="5" fill="#ececf0"/>
            <text x="84" y="115" font-size="10" fill="#1d1d1f" text-anchor="middle" data-text="whatsapp.picture.dont-allow"></text>
            <rect x="124" y="100" width="64" height="22" rx="5" fill="#2f6fde"/>
            <text x="156" y="115" font-size="10" fill="#fff" text-anchor="middle" data-text="whatsapp.picture.allow"></text>
            <rect x="120" y="96" width="72" height="30" rx="8" fill="none" stroke="#e8590c" stroke-width="2.5"/>
          </svg>
          <figcaption data-text="whatsapp.picture.allow-prompt"></figcaption>
        </figure>
      </div>
    </div>
    <div id="source-later" class="source" hidden>
      <h2 id="source-later-title"></h2>
      <p class="note" data-text="source.not-here"></p>
    </div>
    <p id="connect-done" class="note" data-text="connect.done" hidden></p>
    <div id="source-status" class="status" role="status" hidden>
      <p id="source-message"></p>
      <code id="source-url" hidden></code>
      <ul id="source-kids" class="kids" hidden></ul>
      <div id="source-install" class="install" hidden>
        <code id="source-install-line"></code>
        <button type="button" id="source-copy" class="secondary" data-text="copy"></button>
      </div>
      <button type="button" id="gmail-two-step" class="secondary" data-text="gmail.two-step" hidden></button>
      <button type="button" id="wilma-again" class="secondary" data-text="wilma.again" hidden></button>
      <button type="button" id="wilma-terminal" class="secondary" data-text="wilma.terminal" hidden></button>
      <button type="button" id="claude-again" class="secondary" data-text="claude.again" hidden></button>
      <button type="button" id="claude-terminal" class="secondary" data-text="claude.terminal" hidden></button>
    </div>
    <p><button type="button" id="source-skip" class="secondary" data-text="source.skip" hidden></button></p>
  </section>
  <section id="phase" hidden>
    <h1 id="phase-title"></h1>
    <p class="note" data-text="phase.not-here"></p>
  </section>
  <p id="error" class="error" role="alert" hidden></p>
</main>
</body>
</html>
