<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Parent Recap</title>
<link rel="stylesheet" href="page.css">
<script src="page.js" defer></script>
</head>
<body>
<header>
  <span class="product">Parent Recap</span>
  <label class="switch">
    <span class="hidden-label" data-text="language.label"></span>
    <select id="language-switch"></select>
  </label>
</header>
<main>
  <p id="keychain-unreachable" class="error" role="alert" data-text="keychain.not-reachable" hidden></p>
  <section id="language" hidden>
    <h1 data-text="language.question"></h1>
    <p class="note" data-text="language.note"></p>
    <form id="language-form">
      <fieldset id="language-choices"></fieldset>
      <button type="submit" data-text="continue"></button>
    </form>
  </section>
  <ol id="phases" class="phases" hidden></ol>
  <section id="welcome" hidden>
    <h1 data-text="welcome.title"></h1>
    <p class="note" data-text="welcome.intro"></p>
    <form id="welcome-form">
      <fieldset>
        <legend data-text="welcome.ai"></legend>
        <label><input type="radio" name="ai" value="claude"><span data-text="welcome.ai.claude"></span></label>
        <label><input type="radio" name="ai" value="codex"><span data-text="welcome.ai.codex"></span></label>
        <p class="hint" data-text="welcome.ai.plan"></p>
        <div id="ai-status" class="status" role="status">
          <p id="ai-message"></p>
          <div id="ai-install" class="install" hidden>
            <code id="ai-install-line"></code>
            <button type="button" id="ai-copy" class="secondary" data-text="copy"></button>
          </div>
          <button type="button" id="ai-again" class="secondary" data-text="welcome.ai.again" hidden></button>
        </div>
      </fieldset>
      <fieldset>
        <legend data-text="welcome.partner"></legend>
        <label><input type="radio" name="partner" value="add"><span data-text="welcome.partner.add"></span></label>
        <label><input type="radio" name="partner" value="only-me"><span data-text="welcome.partner.only-me"></span></label>
        <div id="partner-details" class="details">
          <div class="field">
            <label for="partner-address" data-text="welcome.partner.address"></label>
            <input type="email" id="partner-address" autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label for="partner-language" data-text="welcome.partner.language"></label>
            <select id="partner-language"></select>
          </div>
        </div>
      </fieldset>
      <fieldset id="welcome-feedback">
        <legend data-text="welcome.feedback"></legend>
        <label><input type="radio" name="feedback" value="yes"><span data-text="welcome.feedback.yes"></span></label>
        <label><input type="radio" name="feedback" value="no"><span data-text="welcome.feedback.no"></span></label>
        <p class="hint" data-text="welcome.feedback.note"></p>
      </fieldset>
      <h2 data-text="welcome.next"></h2>
      <p data-text="welcome.sources"></p>
      <p class="ready" data-text="welcome.wilma"></p>
      <button type="submit" id="welcome-continue" data-text="continue"></button>
    </form>
  </section>
  <section id="connect" hidden>
    <h1 data-text="connect.title"></h1>
    <p class="note" data-text="connect.intro"></p>
    <ol id="sources" class="sources"></ol>
    <p id="source-handoff" class="handoff" role="status" hidden></p>
    <div id="source-wilma" class="source" hidden>
      <h2 data-text="source.wilma"></h2>
      <fieldset>
        <legend data-text="wilma.uses"></legend>
        <label><input type="radio" name="wilma-uses" value="yes" checked><span data-text="wilma.uses.yes"></span></label>
        <label><input type="radio" name="wilma-uses" value="no"><span data-text="wilma.uses.no"></span></label>
      </fieldset>
      <div class="field">
        <label for="wilma-search" data-text="wilma.search"></label>
        <input type="search" id="wilma-search" autocomplete="off" spellcheck="false" disabled>
        <p class="hint" data-text="wilma.search.hint"></p>
      </div>
      <fieldset id="wilma-towns" class="towns"></fieldset>
      <p id="wilma-none" class="hint" data-text="wilma.none-found" hidden></p>
      <form id="wilma-form" class="details">
        <div class="field">
          <label for="wilma-username" data-text="wilma.username"></label>
          <input type="text" id="wilma-username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="wilma-password" data-text="wilma.password"></label>
          <input type="password" id="wilma-password" name="password" autocomplete="current-password" required>
        </div>
        <p class="hint" data-text="wilma.fill"></p>
        <div class="actions">
          <button type="submit" id="wilma-sign-in" data-text="wilma.sign-in"></button>
          <button type="button" id="wilma-passwords" class="secondary" data-text="wilma.passwords"></button>
        </div>
      </form>
      <form id="town-form" class="details" hidden>
        <p class="hint" data-text="wilma.town.note"></p>
        <div class="actions">
          <button type="submit" id="town-save" data-text="wilma.town.save"></button>
        </div>
      </form>
    </div>
    <div id="source-gmail" class="source" hidden>
      <h2 data-text="source.gmail"></h2>
      <p data-text="gmail.explain"></p>
      <p><button type="button" id="gmail-open" class="secondary" data-text="gmail.open"></button></p>
      <form id="gmail-form" class="details">
        <div class="field">
          <label for="gmail-address" data-text="gmail.address"></label>
          <input type="email" id="gmail-address" autocomplete="email" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="gmail-password" data-text="gmail.password"></label>
          <input type="password" id="gmail-password" autocomplete="off" spellcheck="false" required>
        </div>
        <div class="actions">
          <button type="submit" id="gmail-save" data-text="gmail.save"></button>
          <button type="button" id="gmail-unavailable" class="link" data-text="gmail.unavailable"></button>
        </div>
      </form>
    </div>
    <div id="source-ai" class="source" hidden>
      <h2 data-text="source.ai"></h2>
      <div id="ai-claude" hidden>
        <p data-text="claude.explain"></p>
        <p><button type="button" id="claude-start" data-text="claude.start"></button></p>
        <form id="claude-form" class="details" hidden>
          <p class="hint" data-text="claude.paste"></p>
          <div class="field">
            <label for="claude-token" data-text="claude.token"></label>
            <input type="password" id="claude-token" autocomplete="off" spellcheck="false" required>
          </div>
          <div class="actions">
            <button type="submit" id="claude-save" data-text="claude.save"></button>
          </div>
        </form>
      </div>
      <div id="ai-codex" hidden>
        <p data-text="codex.explain"></p>
        <p><button type="button" id="codex-login" data-text="codex.login" hidden></button></p>
      </div>
    </div>
    <div id="source-whatsapp" class="source" hidden>
      <h2 data-text="source.whatsapp"></h2>
      <p data-text="whatsapp.explain"></p>
      <p><button type="button" id="whatsapp-open" data-text="whatsapp.open"></button></p>
      <div class="pictures">
        <figure>
          <svg viewBox="0 0 240 150" role="img" aria-hidden="true">
            <rect x="4" y="18" width="104" height="112" rx="6" fill="#fff" stroke="#D8DDE4"/>
            <rect x="4" y="18" width="104" height="16" rx="6" fill="#E3E7EC"/>
            <rect x="16" y="56" width="80" height="16" rx="3" fill="#2f6fde"/>
            <text x="22" y="68" font-size="10" fill="#fff">python3</text>
            <rect x="16" y="80" width="80" height="10" rx="3" fill="#E3E7EC"/>
            <rect x="16" y="96" width="80" height="10" rx="3" fill="#E3E7EC"/>
            <rect x="132" y="18" width="104" height="112" rx="6" fill="#fff" stroke="#D8DDE4"/>
            <rect x="132" y="18" width="104" height="16" rx="6" fill="#E3E7EC"/>
            <rect x="142" y="48" width="84" height="56" rx="4" fill="#F5F7F9" stroke="#D8DDE4" stroke-dasharray="4 3"/>
            <path d="M96 64 C 118 64, 124 76, 150 76" fill="none" stroke="#2f6fde" stroke-width="3"/>
            <path d="M150 76 l-9 -6 l0 12 z" fill="#2f6fde"/>
          </svg>
          <figcaption data-text="whatsapp.picture.drag"></figcaption>
        </figure>
        <figure>
          <svg viewBox="0 0 240 150" role="img" aria-hidden="true">
            <rect x="4" y="18" width="232" height="112" rx="6" fill="#fff" stroke="#D8DDE4"/>
            <rect x="4" y="18" width="232" height="16" rx="6" fill="#E3E7EC"/>
            <rect x="20" y="52" width="200" height="22" rx="4" fill="#F5F7F9"/>
            <text x="30" y="67" font-size="11" fill="#12161B">python3</text>
            <rect x="178" y="56" width="30" height="14" rx="7" fill="#2f6fde"/>
            <circle cx="201" cy="63" r="5.5" fill="#fff"/>
            <rect x="20" y="82" width="200" height="22" rx="4" fill="#F5F7F9"/>
            <rect x="30" y="90" width="70" height="7" rx="3" fill="#D8DDE4"/>
            <rect x="178" y="86" width="30" height="14" rx="7" fill="#D8DDE4"/>
            <circle cx="185" cy="93" r="5.5" fill="#fff"/>
            <circle cx="193" cy="63" r="22" fill="none" stroke="#C8731A" stroke-width="2.5"/>
          </svg>
          <figcaption data-text="whatsapp.picture.switch"></figcaption>
        </figure>
        <figure>
          <svg viewBox="0 0 240 150" role="img" aria-hidden="true">
            <rect x="40" y="14" width="160" height="122" rx="10" fill="#fff" stroke="#D8DDE4"/>
            <rect x="104" y="26" width="32" height="32" rx="7" fill="#E3E7EC"/>
            <rect x="62" y="68" width="116" height="7" rx="3" fill="#D8DDE4"/>
            <rect x="76" y="80" width="88" height="7" rx="3" fill="#D8DDE4"/>
            <rect x="52" y="100" width="64" height="22" rx="5" fill="#E3E7EC"/>
            <text x="84" y="115" font-size="10" fill="#12161B" text-anchor="middle" data-text="whatsapp.picture.dont-allow"></text>
            <rect x="124" y="100" width="64" height="22" rx="5" fill="#2f6fde"/>
            <text x="156" y="115" font-size="10" fill="#fff" text-anchor="middle" data-text="whatsapp.picture.allow"></text>
            <rect x="120" y="96" width="72" height="30" rx="8" fill="none" stroke="#C8731A" stroke-width="2.5"/>
          </svg>
          <figcaption data-text="whatsapp.picture.allow-prompt"></figcaption>
        </figure>
      </div>
    </div>
    <div id="source-myclub" class="source" hidden>
      <h2 data-text="source.myclub"></h2>
      <p data-text="myclub.explain"></p>
      <p><button type="button" id="myclub-open" class="secondary" data-text="myclub.open"></button></p>
      <div class="pictures">
        <figure>
          <svg viewBox="0 0 240 150" role="img" aria-hidden="true">
            <rect x="4" y="18" width="232" height="112" rx="6" fill="#fff" stroke="#D8DDE4"/>
            <rect x="4" y="18" width="232" height="16" rx="6" fill="#E3E7EC"/>
            <rect x="16" y="44" width="56" height="76" rx="4" fill="#F5F7F9"/>
            <rect x="22" y="52" width="44" height="7" rx="3" fill="#D8DDE4"/>
            <rect x="22" y="66" width="44" height="12" rx="3" fill="#2f6fde"/>
            <rect x="22" y="86" width="44" height="7" rx="3" fill="#D8DDE4"/>
            <rect x="84" y="44" width="140" height="76" rx="4" fill="#F5F7F9"/>
            <rect x="92" y="54" width="22" height="16" rx="2" fill="#fff" stroke="#D8DDE4"/>
            <rect x="120" y="54" width="22" height="16" rx="2" fill="#fff" stroke="#D8DDE4"/>
            <rect x="148" y="54" width="22" height="16" rx="2" fill="#2f6fde"/>
            <rect x="176" y="54" width="22" height="16" rx="2" fill="#fff" stroke="#D8DDE4"/>
            <rect x="92" y="76" width="22" height="16" rx="2" fill="#2f6fde"/>
            <rect x="120" y="76" width="22" height="16" rx="2" fill="#fff" stroke="#D8DDE4"/>
            <rect x="148" y="76" width="22" height="16" rx="2" fill="#fff" stroke="#D8DDE4"/>
            <rect x="176" y="76" width="22" height="16" rx="2" fill="#2f6fde"/>
            <circle cx="44" cy="72" r="26" fill="none" stroke="#C8731A" stroke-width="2.5"/>
          </svg>
          <figcaption data-text="myclub.picture.calendar"></figcaption>
        </figure>
        <figure>
          <svg viewBox="0 0 240 150" role="img" aria-hidden="true">
            <rect x="4" y="18" width="232" height="112" rx="6" fill="#fff" stroke="#D8DDE4"/>
            <rect x="4" y="18" width="232" height="16" rx="6" fill="#E3E7EC"/>
            <rect x="20" y="48" width="120" height="8" rx="3" fill="#D8DDE4"/>
            <rect x="20" y="64" width="90" height="8" rx="3" fill="#D8DDE4"/>
            <rect x="20" y="92" width="120" height="24" rx="5" fill="#2f6fde"/>
            <text x="80" y="108" font-size="10" fill="#fff" text-anchor="middle" data-text="myclub.picture.subscribe-button"></text>
            <rect x="14" y="86" width="132" height="36" rx="8" fill="none" stroke="#C8731A" stroke-width="2.5"/>
          </svg>
          <figcaption data-text="myclub.picture.subscribe"></figcaption>
        </figure>
        <figure>
          <svg viewBox="0 0 240 150" role="img" aria-hidden="true">
            <rect x="24" y="22" width="192" height="106" rx="10" fill="#fff" stroke="#D8DDE4"/>
            <rect x="40" y="38" width="100" height="8" rx="3" fill="#D8DDE4"/>
            <rect x="40" y="58" width="160" height="22" rx="4" fill="#F5F7F9" stroke="#D8DDE4"/>
            <text x="48" y="73" font-size="10" fill="#12161B">webcal://…</text>
            <rect x="136" y="94" width="64" height="22" rx="5" fill="#2f6fde"/>
            <rect x="152" y="102" width="32" height="7" rx="3" fill="#fff"/>
            <rect x="34" y="52" width="172" height="34" rx="8" fill="none" stroke="#C8731A" stroke-width="2.5"/>
          </svg>
          <figcaption data-text="myclub.picture.copy"></figcaption>
        </figure>
      </div>
      <form id="myclub-kid-form" class="details" hidden>
        <p class="hint" data-text="myclub.add.note"></p>
        <div class="field">
          <label for="myclub-kid-name" data-text="myclub.add.name"></label>
          <input type="text" id="myclub-kid-name" autocomplete="off" required>
        </div>
        <div class="actions">
          <button type="submit" id="myclub-kid-add" class="secondary" data-text="myclub.add"></button>
        </div>
      </form>
      <form id="myclub-form" class="details">
        <p data-text="myclub.kid"></p>
        <fieldset id="myclub-kids" class="towns"></fieldset>
        <div class="field">
          <label for="myclub-link" data-text="myclub.link"></label>
          <input type="password" id="myclub-link" autocomplete="off" spellcheck="false" required>
        </div>
        <div class="actions">
          <button type="submit" id="myclub-save" data-text="myclub.save"></button>
        </div>
      </form>
      <div id="myclub-more" class="details" hidden>
        <p class="hint" data-text="myclub.more"></p>
        <div class="actions">
          <button type="button" id="myclub-continue" data-text="continue"></button>
        </div>
      </div>
    </div>
    <div id="connect-done" hidden>
      <p class="note" data-text="connect.done"></p>
      <p><button type="button" id="connect-continue" data-text="continue"></button></p>
    </div>
    <div id="source-status" class="status" role="status" hidden>
      <p id="source-message"></p>
      <code id="source-url" hidden></code>
      <ul id="source-kids" class="kids" hidden></ul>
      <div id="source-install" class="install" hidden>
        <code id="source-install-line"></code>
        <button type="button" id="source-copy" class="secondary" data-text="copy"></button>
      </div>
      <button type="button" id="gmail-two-step" class="secondary" data-text="gmail.two-step" hidden></button>
      <button type="button" id="wilma-again" class="secondary" data-text="wilma.again" hidden></button>
      <button type="button" id="wilma-terminal" class="secondary" data-text="wilma.terminal" hidden></button>
      <button type="button" id="claude-again" class="secondary" data-text="claude.again" hidden></button>
      <button type="button" id="claude-terminal" class="secondary" data-text="claude.terminal" hidden></button>
    </div>
    <p><button type="button" id="source-skip" class="secondary" data-text="source.skip" hidden></button></p>
  </section>
  <section id="working" hidden>
    <h1 data-text="working.title"></h1>
    <p class="note" data-text="working.intro"></p>
    <ul id="working-list" class="sources working"></ul>
    <progress id="working-bar" max="1" value="0"></progress>
    <div id="working-status" class="status" role="status" hidden>
      <p id="working-message"></p>
      <button type="button" id="working-again" class="secondary" data-text="working.again" hidden></button>
    </div>
  </section>
  <section id="check" hidden>
    <h1 data-text="check.title"></h1>
    <p class="note" data-text="check.intro"></p>
    <form id="check-form">
      <fieldset>
        <legend data-text="check.kids"></legend>
        <p class="hint" data-text="check.kids.note"></p>
        <div id="check-kids" class="ticks"></div>
        <div id="check-kid-form" class="add">
          <div class="field">
            <label for="check-kid-name" data-text="check.kid.add.name"></label>
            <input type="text" id="check-kid-name" autocomplete="off">
          </div>
          <button type="button" id="check-kid-add" class="secondary" data-text="check.kid.add"></button>
        </div>
      </fieldset>
      <fieldset id="check-whatsapp">
        <legend data-text="check.whatsapp"></legend>
        <p class="hint" data-text="check.whatsapp.note"></p>
        <label class="all"><input type="checkbox" id="check-whatsapp-all"><span data-text="check.all"></span></label>
        <div id="check-groups" class="ticks towns"></div>
      </fieldset>
      <fieldset>
        <legend data-text="check.senders"></legend>
        <p class="hint" data-text="check.senders.note"></p>
        <p id="check-senders-none" class="ready" data-text="check.senders.none" hidden></p>
        <label class="all"><input type="checkbox" id="check-senders-all"><span data-text="check.all"></span></label>
        <div id="check-senders" class="ticks towns"></div>
      </fieldset>
      <fieldset>
        <legend data-text="check.recipients"></legend>
        <div id="check-recipients" class="details"></div>
      </fieldset>
      <fieldset>
        <legend data-text="check.evening"></legend>
        <div class="field">
          <label for="check-evening" data-text="check.evening.label"></label>
          <input type="time" id="check-evening" step="60" required>
        </div>
        <p class="hint" data-text="check.evening.note"></p>
      </fieldset>
      <fieldset id="check-feedback" hidden>
        <legend data-text="check.feedback"></legend>
        <div class="field">
          <label for="check-household-label" data-text="check.feedback.label"></label>
          <input type="text" id="check-household-label" autocomplete="off" spellcheck="false">
        </div>
        <p class="hint" data-text="check.feedback.note"></p>
      </fieldset>
      <button type="submit" id="check-confirm" data-text="check.confirm"></button>
    </form>
    <div id="health" class="status" role="status" hidden>
      <p id="health-message"></p>
      <ul id="health-checks" class="checks"></ul>
    </div>
  </section>
  <section id="first-brief" hidden>
    <h1 data-text="brief.title"></h1>
    <p class="note" data-text="brief.intro"></p>
    <ul id="brief-list" class="sources working" hidden></ul>
    <div id="brief-status" class="status" role="status" hidden>
      <p id="brief-message"></p>
      <button type="button" id="brief-again" class="secondary" data-text="brief.again" hidden></button>
    </div>
    <iframe id="brief-frame" class="brief" data-label="brief.frame" sandbox hidden></iframe>
    <div id="brief-actions" hidden>
      <button type="button" id="brief-send" data-text="brief.send"></button>
      <div id="brief-feedback" hidden>
        <button type="button" id="brief-feedback-open" class="secondary" data-text="brief.feedback"></button>
        <p class="hint" data-text="brief.feedback.note"></p>
      </div>
    </div>
    <div id="brief-sent" class="status" role="status" hidden>
      <p id="brief-sent-message"></p>
      <button type="button" id="brief-done" data-text="brief.done"></button>
    </div>
  </section>
  <section id="finish" hidden>
    <h1 data-text="finish.title"></h1>
    <div id="finish-install" hidden>
      <p class="note" data-text="finish.intro"></p>
      <div class="actions">
        <button type="button" id="finish-start" data-text="finish.start"></button>
        <button type="button" id="finish-stop" class="secondary" data-text="finish.stop" hidden></button>
      </div>
    </div>
    <div id="finish-status" class="status" role="status" hidden>
      <p id="finish-message"></p>
      <p id="finish-wake"></p>
      <ul id="finish-other" class="kids" hidden></ul>
      <button type="button" id="finish-replace" class="secondary" data-text="finish.replace" hidden></button>
    </div>
    <div id="finish-stopped" class="status" role="status" hidden>
      <p id="finish-stopped-message"></p>
    </div>
    <h2 data-text="finish.checklist"></h2>
    <ul id="finish-checklist" class="checks"></ul>
    <p class="ready" data-text="finish.restart"></p>
    <p id="finish-changes" class="note"></p>
    <p id="finish-closed" class="hint" data-text="finish.closed" hidden></p>
  </section>
  <div id="chat" class="chat" hidden>
    <p class="hint" data-text="chat.note"></p>
    <button type="button" id="chat-continue" class="secondary" data-text="chat.continue"></button>
    <div id="chat-status" class="status" role="status" hidden>
      <p id="chat-message"></p>
      <div id="chat-line" class="install" hidden>
        <code id="chat-line-text"></code>
        <button type="button" id="chat-copy" class="secondary" data-text="copy"></button>
      </div>
    </div>
  </div>
  <p id="error" class="error" role="alert" hidden></p>
</main>
</body>
</html>
