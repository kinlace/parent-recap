# What a model costs on the Anthropic API, in USD per million tokens, for the eval's cost per night.
# A subscription (Claude Pro/Max) bills none of this: these are the prices the maintainers would
# pay with an API key (#186). Update `read` with the prices, and add a model before comparing it.
read: 2026-10-10
source: https://platform.claude.com/docs/en/about-claude/pricing
models:
  # cache_write is the 5-minute cache, the one the claude CLI writes.
  claude-fable-5-1:
    { input: 10.00, cache_write: 12.50, cached_input: 0.25, output: 50.00 }
  claude-opus-5-5:
    { input: 4.00, cache_write: 5.00, cached_input: 0.20, output: 20.00 }
  claude-sonnet-5-5:
    { input: 2.00, cache_write: 2.50, cached_input: 0.10, output: 10.00 }
  claude-sonnet-5:
    { input: 2.00, cache_write: 2.50, cached_input: 0.20, output: 10.00 }
  claude-haiku-5-5:
    input: 0.10
    cache_write: 0.125
    cached_input: 0.01
    output: 0.50
    # A prompt over 100,000 tokens is priced higher, all of it.
    long_prompt:
      {
        over: 100000,
        input: 0.50,
        cache_write: 0.625,
        cached_input: 0.05,
        output: 2.50,
      }
  claude-haiku-4-5:
    { input: 1.00, cache_write: 1.25, cached_input: 0.10, output: 5.00 }
# The names the claude CLI's --model also takes.
aliases:
  fable: claude-fable-5-1
  opus: claude-opus-5-5
  sonnet: claude-sonnet-5-5
  haiku: claude-haiku-5-5
