covers: [mixed-languages]
note: >
  Monday night. A Wilma message full of everyday Finnish words (eväät, säänmukaiset
  ulkoiluvarusteet, kota, pieni herkku) and one term a parent needs later, vanhempainilta. A Brief
  in English or Chinese translates the everyday words and keeps vanhempainilta in brackets after
  its translation (ADR 0004).
now: 2026-10-12T21:00:00+03:00
messages:
  - id: w-kota-1012
    source: wilma
    at: 2026-10-12T13:40:00+03:00
    sender: Laine Maija
    subject: Ulkoilupäivä ja vanhempainilta
    kid_hint: Virtanen Aino
    body: |
      Hei 4B:n huoltajat!
      Perjantaina 16.10. vietämme ulkoilupäivän kodalla koulun metsässä. Lapsilla pitää olla
      säänmukaiset ulkoiluvarusteet ja omat eväät. Mukaan saa pakata myös pienen herkun.
      Luokan vanhempainilta on tiistaina 20.10. klo 18. Ilmoittautukaa Wilman lomakkeella
      torstaihin 15.10. mennessä.
      Terveisin, Maija Laine
