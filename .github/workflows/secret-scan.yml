name: secret-scan

# The public repo must stay free of secrets (ADR 0003): gitleaks scans every push
# and PR, and any finding fails the run.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the whole history, not only the tip.
          fetch-depth: 0
      # The binary, not gitleaks-action, which needs a paid license for organizations.
      - name: Install gitleaks
        run: |
          gh release download "v$GITLEAKS_VERSION" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      # Exits 1 on any finding, which fails the job.
      - name: Scan
        run: ./gitleaks git --redact --no-banner .
