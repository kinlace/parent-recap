name: tests

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main, refactor]
  # The release workflow calls this before publishing a tag.
  workflow_call:

jobs:
  test:
    # macOS is the only platform Parent Recap supports, and Actions minutes are free
    # on a public repo, so every run (PRs, main, tags) is on macOS (ADR 0002).
    runs-on: macos-latest
    # The suite takes about 5 minutes. A hung test fails the job here instead of holding a
    # macOS runner for GitHub's 6-hour limit (#216).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # A python-build-standalone Python, the kind install.sh gives families. test_install.py's
      # stand-in pinned Python is a copy of it, which a python.org framework build can't stand in for.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Python
        run: |
          uv python install 3.13
          uv venv --seed --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # As install.sh installs: prebuilt packages only, at the pinned versions, with the google
      # extra a Google Calendar Household gets.
      - name: Install
        # Quoted as a block: in plain YAML, the colon and space after `:all:` would start a mapping.
        run: |
          python -m pip install --only-binary :all: -c constraints.txt -e '.[test,google]'
      # This runner is an Apple Silicon Mac. The check covers Intel Macs too.
      - name: Check every pinned package has a wheel for both kinds of Mac
        run: python ../scripts/check_wheels.py
      # Includes the version-consistency check (tests/test_version.py).
      - name: Test
        run: python -m pytest
