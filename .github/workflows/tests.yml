name: tests

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main, refactor]
  # The release workflow calls this before publishing a tag.
  workflow_call:

# Python warns when a file or a program's output is opened without an encoding, and pytest makes
# that an error in the program's own code (app/pyproject.toml): on Windows such a file is read and
# written in the PC's code page, which can't hold a Chinese name (#321).
env:
  PYTHONWARNDEFAULTENCODING: "1"

# The PR jobs run the repo's own scripts, which a PR may change, so they get a read-only token and
# no secrets. The repo's default says so too; this keeps it true if that default changes (#720).
permissions:
  contents: read

jobs:
  changes:
    # A PR or push that only touches docs no test reads skips the jobs below. A skipped job counts
    # as passed for main's ruleset, so the required `test` check still lets the PR merge. docs/*.md,
    # README.md, CHANGELOG.md and the skills are left out of the list: tests read them. A tag
    # (the release workflow's call) always runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The PR's merge commit against its first parent, the base it merges into.
            base="HEAD^1"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          others=$(git diff --name-only "$base" HEAD | grep -v -E \
            '^(docs/(adr|agents)/|(CONTEXT|CONTRIBUTING|CLAUDE|SECURITY|THIRD_PARTY_NOTICES)\.md$)' || true)
          echo "Changed outside the docs no test reads:"; echo "${others:-(nothing)}"
          echo "code=$([ -n "$others" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS is the platform Parent Recap supports, and Actions minutes are free on a
    # public repo, so every run (PRs, main, tags) is on macOS (ADR 0002). The windows
    # job below only checks the program as the Windows version is built (ADR 0019).
    runs-on: macos-latest
    # The suite takes a few minutes. A hung test fails the job here instead of holding a
    # macOS runner for GitHub's 6-hour limit (#216).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # A python-build-standalone Python, the kind install.sh gives families. test_install.py's
      # stand-in pinned Python is a copy of it, which a python.org framework build can't stand in for.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Python
        run: |
          uv python install 3.13
          uv venv --seed --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # As install.sh installs: prebuilt packages only, at the pinned versions, with the google
      # extra a Google Calendar Household gets.
      - name: Install
        # Quoted as a block: in plain YAML, the colon and space after `:all:` would start a mapping.
        run: |
          python -m pip install --only-binary :all: -c constraints.txt -e '.[test,google]'
      # This runner is an Apple Silicon Mac. The check covers Intel Macs too.
      - name: Check every pinned package has a wheel for both kinds of Mac
        run: python ../scripts/check_wheels.py
      # One step per test layer (tests/README.md), fastest first, so a failure in the fast layers
      # shows in a minute and the slower ones don't run after it. The slowest tests are listed, so
      # a run that got slower shows which test did it. Each step adds to the same coverage data;
      # the last prints the table (lines and branches per module, pyproject.toml's
      # [tool.coverage]) of what the suite reaches, with no threshold: numbers for tickets that
      # trade end-to-end tests for unit tests (#403). The slow layers run on every core
      # (pytest-xdist's -n auto), and pytest-cov combines the workers' coverage (#509); the fast
      # ones take seconds, less than starting the workers would save.
      - name: Unit tests
        run: python -m pytest -m unit --durations=15 --cov --cov-report=
      - name: Integration tests
        run: python -m pytest -m integration --durations=15 --cov --cov-append --cov-report=
      - name: End-to-end tests
        run: python -m pytest -m "e2e and not browser" -n auto --durations=15 --cov --cov-append --cov-report=
      - name: Adapter tests
        run: python -m pytest -m adapters --durations=15 --cov --cov-append --cov-report=
      # Includes the version-consistency check (tests/scripts/test_version.py).
      - name: Script tests
        run: python -m pytest -m scripts -n auto --durations=15 --cov --cov-append --cov-report=
      # The setup page in a real browser (ADR 0024), the slowest layer, last. Playwright's Chromium
      # is cached per Playwright version, which constraints.txt pins.
      - name: Playwright's version
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's Chromium
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright's Chromium
        run: python -m playwright install --only-shell chromium
      # -rs prints why a test skipped, so a run that skipped them all says so.
      - name: Browser tests
        run: python -m pytest -m browser -n auto -rs --durations=15 --cov --cov-append --cov-report=term --cov-report=html
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: app/htmlcov

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The unit, integration and adapter layers, and the end-to-end tests that need Windows, so
    # maintainers learn on every push whether the program still works on Windows (ADR 0019).
    # Tests marked `macos` skip themselves here.
    runs-on: windows-latest
    # The real Task Scheduler tests alone take about 12 minutes on the runner (#313), so a green
    # run takes about 18 and a limit of 20 cut most runs off.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      # The tests read and write their own files as UTF-8 without saying so, which Python on
      # Windows does only in UTF-8 mode. The program names UTF-8 itself, as the warning above
      # checks, so this doesn't hide a family's code page from it.
      PYTHONUTF8: "1"
    steps:
      # The golden files and fixtures keep the repo's line endings, as on macOS.
      - name: Keep line endings
        working-directory: .
        run: git config --global core.autocrlf false
      # The tests pin the local timezone to Helsinki (conftest.py's NOW) through time-machine, which
      # can't change it on Windows, where there is no time.tzset(). So the runner itself is set to
      # Helsinki, as a Finnish family's PC is.
      - name: Helsinki time
        working-directory: .
        # Not bash: Git Bash would turn the /s switch into a path.
        shell: pwsh
        run: tzutil /s "FLE Standard Time"
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Python
        run: |
          uv python install 3.13
          uv venv --seed --python 3.13
          cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
      - name: Install
        run: |
          python -m pip install --only-binary :all: -c constraints.txt -e '.[test,google]'
      - name: Unit tests
        run: python -m pytest -m unit --durations=15
      - name: Integration tests
        run: python -m pytest -m integration --durations=15
      - name: Adapter tests
        run: python -m pytest -m adapters --durations=15
      # The end-to-end tests that need Windows run nowhere else.
      - name: End-to-end tests that need Windows
        run: python -m pytest -m "e2e and windows" --durations=15

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The program's own tests on Linux, which the hosted version runs on (ADR 0029), so a Linux
    # regression shows on every push. Tests marked `macos` or `windows` skip themselves here; the
    # browser tests run on macOS only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      # The tests pin the local timezone to Helsinki through time-machine, as on macOS.
      TZ: Europe/Helsinki
    steps:
      - uses: actions/checkout@v7
      # A python-build-standalone Python, as on macOS: test_install.py copies it for its pinned one.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Python
        run: |
          uv python install 3.13
          uv venv --seed --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          python -m pip install --only-binary :all: -c constraints.txt -e '.[test,google]'
      - name: Unit tests
        run: python -m pytest -m unit --durations=15
      - name: Integration tests
        run: python -m pytest -m integration --durations=15
      - name: End-to-end tests
        run: python -m pytest -m "e2e and not browser" -n auto --durations=15
      - name: Adapter tests
        run: python -m pytest -m adapters --durations=15
      - name: Script tests
        run: python -m pytest -m scripts -n auto --durations=15

  linux-install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # install.sh on a clean Ubuntu, as the gateway server runs, on both chips, from this checkout,
    # with the real downloads and no root (ADR 0029).
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      INSTALLED: /home/runner/ParentRecap
    steps:
      - uses: actions/checkout@v7
      # Prints the published line for a pin that doesn't match, so a bump can copy it.
      - name: The pinned Linux Python and Node are the ones their projects published
        run: |
          pin() (sed -n "s/^$1=//p" install.sh)
          py=$(pin PYTHON_VERSION) build=$(pin PYTHON_BUILD) node=$(pin NODE_VERSION)
          curl -fsSL "https://github.com/astral-sh/python-build-standalone/releases/download/$build/SHA256SUMS" > python.sums
          curl -fsSL "https://nodejs.org/dist/v$node/SHASUMS256.txt" > node.sums
          # $1 the pin's name, $2 the published list, $3 the file
          check() (
            # The file name as it is: its + and . would be patterns to grep -E.
            line=$(awk -v file="$3" '$2 == file || $2 == "*" file' "$2")
            [ "$(pin "$1")" = "$(echo "$line" | cut -d' ' -f1)" ] ||
              ! echo "$3: install.sh pins $1=$(pin "$1"), the published list says: $line"
          )
          wrong=0
          check PYTHON_SHA256_LINUX_AARCH64 python.sums "cpython-$py+$build-aarch64-unknown-linux-gnu-install_only.tar.gz" || wrong=1
          check PYTHON_SHA256_LINUX_X86_64 python.sums "cpython-$py+$build-x86_64-unknown-linux-gnu-install_only.tar.gz" || wrong=1
          check NODE_SHA256_LINUX_ARM64 node.sums "node-v$node-linux-arm64.tar.xz" || wrong=1
          check NODE_SHA256_LINUX_X64 node.sums "node-v$node-linux-x64.tar.xz" || wrong=1
          rm python.sums node.sums
          exit $wrong
      - name: Install
        run: |
          bash install.sh
          head -1 "$INSTALLED"/logs/install-*.log
      - name: The installed program runs on its own Python and Node
        run: |
          py="$INSTALLED/app/.venv/bin/python"
          "$INSTALLED/app/.venv/bin/parent-recap" --help > /dev/null
          "$py" -c "import sys; from family_brief import own_node; n = own_node.node(); print(n, own_node.npm()); sys.exit(n is None or own_node.npm() is None)"
          "$py" -c "import os, sys; p = os.path.realpath(sys._base_executable); print(p); sys.exit('ParentRecap' not in p)"
      - name: A new login shell runs parent-recap
        run: |
          found=$(bash -l -c 'command -v parent-recap')
          echo "parent-recap: $found"
          [ "$(readlink -f "$found")" = "$(readlink -f "$INSTALLED/app/.venv/bin/parent-recap")" ]
          bash -l -c 'parent-recap --help' > /dev/null
      # As the setup page's Wilma step installs it, from npm, with the program's own Node.
      - name: The wilma CLI installs and runs on the program's own Node
        run: |
          py="$INSTALLED/app/.venv/bin/python"
          "$py" -c "import sys; from family_brief import setup_wilma; r = setup_wilma.install(); print(r); sys.exit(r['result'] != 'installed')"
          "$py" -c "import subprocess, sys; from family_brief import own_node; c = own_node.wilma(); print(c); sys.exit(subprocess.run([*c, '--help'], env=own_node.wilma_env()).returncode)"
      # ADR 0030: the file is the Household user's alone.
      - name: A secret is stored in an owner-only file under the config folder
        run: |
          py="$INSTALLED/app/.venv/bin/python"
          where=$("$py" -c "from family_brief import gateway; from family_brief.system import secrets; secrets.put(gateway.ACCOUNT, 'sk-ci-not-a-real-key'); print(secrets.where(gateway.ACCOUNT))")
          echo "$where"
          [ "$(stat -c %a "$where")" = 600 ] && [ "$(stat -c %a "$(dirname "$where")")" = 700 ]
          [[ "$where" == "$HOME/.family/secrets/"* ]]
      - name: A second install downloads nothing
        run: |
          before=$(stat -c %Y "$INSTALLED"/runtime/*)
          bash install.sh
          [ "$(stat -c %Y "$INSTALLED"/runtime/*)" = "$before" ]

  windows-install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # install.ps1 on a clean Windows PC, from this checkout, with the real downloads (ADR 0019).
    # Windows PowerShell 5.1, which is what runs the line families paste. Each step is one check of
    # scripts/windows-install-checks.ps1, which holds what it expects of the program and asks the
    # installed program for what it offers, so a program change edits nothing here (#720).
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - name: The pinned Python and Node are the ones their projects published
        run: scripts\windows-install-checks.ps1 pins
      - name: A download that fails says so and leaves nothing half there
        run: scripts\windows-install-checks.ps1 failed-download
      - name: Every type install.ps1 names is .NET's own, with PSReadLine loaded
        run: scripts\windows-install-checks.ps1 net-types
      - name: The install picks up from there, in a PowerShell with PSReadLine loaded
        run: scripts\windows-install-checks.ps1 install
      - name: The installed program runs on its own Python and Node
        run: scripts\windows-install-checks.ps1 own-runtimes
      - name: A new PowerShell window runs parent-recap, and python is still the PC's own
        run: scripts\windows-install-checks.ps1 new-window
      - name: The installed program serves the setup page with the Windows steps
        run: scripts\windows-install-checks.ps1 setup-page
      - name: A second install downloads and installs nothing
        run: scripts\windows-install-checks.ps1 second-install
      - name: The wilma CLI installs and runs on the program's own Node
        run: scripts\windows-install-checks.ps1 wilma
      - name: Uninstall leaves no task, credential or folder of Parent Recap's
        run: scripts\windows-install-checks.ps1 uninstall
