name: tests

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main, refactor]
  # The release workflow calls this before publishing a tag.
  workflow_call:

jobs:
  test:
    # macOS is the only platform FamilyBrief supports, and Actions minutes are free
    # on a public repo, so every run (PRs, main, tags) is on macOS (ADR 0002).
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e '.[test]'
      # Includes the version-consistency check (tests/test_version.py).
      - name: Test
        run: python -m pytest
