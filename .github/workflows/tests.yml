name: tests

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main, refactor]
  # The release workflow calls this before publishing a tag.
  workflow_call:

# Python warns when a file or a program's output is opened without an encoding, and pytest makes
# that an error in the program's own code (app/pyproject.toml): on Windows such a file is read and
# written in the PC's code page, which can't hold a Chinese name (#321).
env:
  PYTHONWARNDEFAULTENCODING: "1"

jobs:
  changes:
    # A PR or push that only touches docs no test reads skips the jobs below. A skipped job counts
    # as passed for main's ruleset, so the required `test` check still lets the PR merge. docs/*.md,
    # README.md, CHANGELOG.md and the skills are left out of the list: tests read them. A tag
    # (the release workflow's call) always runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The PR's merge commit against its first parent, the base it merges into.
            base="HEAD^1"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          others=$(git diff --name-only "$base" HEAD | grep -v -E \
            '^(docs/(adr|agents)/|(CONTEXT|CONTRIBUTING|CLAUDE|SECURITY|THIRD_PARTY_NOTICES)\.md$)' || true)
          echo "Changed outside the docs no test reads:"; echo "${others:-(nothing)}"
          echo "code=$([ -n "$others" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS is the platform Parent Recap supports, and Actions minutes are free on a
    # public repo, so every run (PRs, main, tags) is on macOS (ADR 0002). The windows
    # job below only checks the program as the Windows version is built (ADR 0019).
    runs-on: macos-latest
    # The suite takes about 5 minutes. A hung test fails the job here instead of holding a
    # macOS runner for GitHub's 6-hour limit (#216).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # A python-build-standalone Python, the kind install.sh gives families. test_install.py's
      # stand-in pinned Python is a copy of it, which a python.org framework build can't stand in for.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Python
        run: |
          uv python install 3.13
          uv venv --seed --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # As install.sh installs: prebuilt packages only, at the pinned versions, with the google
      # extra a Google Calendar Household gets.
      - name: Install
        # Quoted as a block: in plain YAML, the colon and space after `:all:` would start a mapping.
        run: |
          python -m pip install --only-binary :all: -c constraints.txt -e '.[test,google]'
      # This runner is an Apple Silicon Mac. The check covers Intel Macs too.
      - name: Check every pinned package has a wheel for both kinds of Mac
        run: python ../scripts/check_wheels.py
      # Includes the version-consistency check (tests/test_version.py). The slowest tests are
      # listed, so a run that got slower shows which test did it.
      - name: Test
        run: python -m pytest --durations=15

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Every test that doesn't need macOS, so maintainers learn on every push whether the program
    # still works on Windows (ADR 0019). Tests marked `macos` skip themselves here.
    runs-on: windows-latest
    # The real Task Scheduler tests alone take about 12 minutes on the runner (#313), so a green
    # run takes about 18 and a limit of 20 cut most runs off.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      # The tests read and write their own files as UTF-8 without saying so, which Python on
      # Windows does only in UTF-8 mode. The program names UTF-8 itself, as the warning above
      # checks, so this doesn't hide a family's code page from it.
      PYTHONUTF8: "1"
    steps:
      # The golden files and fixtures keep the repo's line endings, as on macOS.
      - name: Keep line endings
        working-directory: .
        run: git config --global core.autocrlf false
      # The tests pin the local timezone to Helsinki (conftest.py's NOW) through time-machine, which
      # can't change it on Windows, where there is no time.tzset(). So the runner itself is set to
      # Helsinki, as a Finnish family's PC is.
      - name: Helsinki time
        working-directory: .
        # Not bash: Git Bash would turn the /s switch into a path.
        shell: pwsh
        run: tzutil /s "FLE Standard Time"
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Python
        run: |
          uv python install 3.13
          uv venv --seed --python 3.13
          cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
      - name: Install
        run: |
          python -m pip install --only-binary :all: -c constraints.txt -e '.[test,google]'
      - name: Test
        run: python -m pytest --durations=15

  windows-install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # install.ps1 on a clean Windows PC, from this checkout, with the real downloads (ADR 0019).
    # Windows PowerShell 5.1, which is what runs the line families paste.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      PARENT_RECAP: ${{ github.workspace }}\install.ps1
    steps:
      - uses: actions/checkout@v7
      - name: Where it installs
        run: Add-Content $env:GITHUB_ENV "INSTALLED=$env:LOCALAPPDATA\ParentRecap" -Encoding utf8
      # Prints the published line for a pin that doesn't match, so a bump can copy it.
      - name: The pinned Python and Node are the ones their projects published
        run: |
          $ps1 = Get-Content install.ps1 -Raw
          function Pin([string]$Name) {
            if ($ps1 -notmatch ('(?m)^\s*\$' + $Name + " = '([^']*)'")) { throw "install.ps1 pins no $Name" }
            return $Matches[1]
          }
          $py = Pin PythonVersion; $build = Pin PythonBuild; $node = Pin NodeVersion
          $pins = @(
            @{ List = "https://github.com/astral-sh/python-build-standalone/releases/download/$build/SHA256SUMS"
               File = "cpython-$py+$build-x86_64-pc-windows-msvc-install_only.tar.gz"; Pinned = Pin PythonSha256 },
            @{ List = "https://nodejs.org/dist/v$node/SHASUMS256.txt"
               File = "node-v$node-win-x64.zip"; Pinned = Pin NodeSha256 })
          $wrong = 0
          foreach ($p in $pins) {
            Invoke-WebRequest $p.List -OutFile sums.txt -UseBasicParsing
            $line = Get-Content sums.txt | Where-Object { $_.Trim() -match ('\s\*?' + [regex]::Escape($p.File) + '$') }
            if (-not $line -or ($line -split '\s+')[0] -ne $p.Pinned) {
              Write-Host "$($p.File): install.ps1 pins $($p.Pinned), $($p.List) says: $line"
              $wrong++
            }
          }
          exit $wrong
      - name: A download that fails says so and leaves nothing half there
        run: |
          (Get-Content install.ps1 -Raw) -replace "PythonReleases = '[^']*'", "PythonReleases = 'https://github.com/kinlace/no-such-release'" |
            Set-Content install-offline.ps1 -Encoding ascii
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File install-offline.ps1 *>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 1) { throw "exited with $code, not 1" }
          if ($out -notmatch "couldn't download its Python") { throw 'no message about the download' }
          if (Get-ChildItem "$env:INSTALLED\runtime" -Filter 'python-*') { throw 'a Python was left behind' }
          Remove-Item install-offline.ps1
          exit 0  # the install's own exit code of 1 was the one expected
      # A family's PowerShell window has PSReadLine loaded, which CI's shell and -File don't, and
      # its own internal types can stand in for .NET's of the same name (#374).
      - name: Every type install.ps1 names is .NET's own, with PSReadLine loaded
        run: |
          Import-Module PSReadLine
          function Test-NetOwn([string]$Name) { $t = $Name -as [type]; [bool]($t -and $t.Assembly.GlobalAssemblyCache) }
          # The type that broke the pasted line in 0.6.0, so this check is known to tell.
          if (Test-NetOwn 'System.Runtime.InteropServices.RuntimeInformation') {
            throw "PSReadLine's RuntimeInformation doesn't stand in for .NET's here, so this check can't tell"
          }
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($env:PARENT_RECAP, [ref]$null, [ref]$null)
          $names = $ast.FindAll({ param($n)
              $n -is [System.Management.Automation.Language.TypeExpressionAst] -or
              $n -is [System.Management.Automation.Language.TypeConstraintAst] }, $true) |
            ForEach-Object { $_.TypeName.FullName } | Sort-Object -Unique
          Write-Host "install.ps1 names: $($names -join ', ')"
          $shadowed = @($names | Where-Object { -not (Test-NetOwn $_) })
          if ($shadowed) { throw "not .NET's own type with PSReadLine loaded: $($shadowed -join ', ')" }
      - name: The install picks up from there, in a PowerShell with PSReadLine loaded
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command 'Import-Module PSReadLine; & $env:PARENT_RECAP; exit $LASTEXITCODE'
          if ($LASTEXITCODE -ne 0) { throw "exited with $LASTEXITCODE" }
          Get-Content "$env:INSTALLED\logs\*.log" -Tail 20
      - name: The installed program runs on its own Python and Node
        run: |
          $py = "$env:INSTALLED\app\.venv\Scripts\python.exe"
          & "$env:INSTALLED\app\.venv\Scripts\parent-recap.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'parent-recap --help failed' }
          & $py -c "import sys; from family_brief import own_node; n = own_node.node(); print(n, own_node.npm()); sys.exit(n is None or own_node.npm() is None)"
          if ($LASTEXITCODE -ne 0) { throw "the program doesn't find its own Node" }
          & $py -c "import sys; print(sys._base_executable); sys.exit('ParentRecap' not in sys._base_executable)"
          if ($LASTEXITCODE -ne 0) { throw "the venv isn't on Parent Recap's own Python" }
      # As the pasted line ends: the installed program's setup page, served on this PC, offering
      # what Windows has and nothing only macOS has (no WhatsApp, the gateway first of the AIs).
      - name: The installed program serves the setup page, without macOS's steps
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'setup-page.txt'
          $page = Start-Process "$env:INSTALLED\app\.venv\Scripts\parent-recap.exe" -ArgumentList 'setup', 'page' `
            -RedirectStandardOutput $out -NoNewWindow -PassThru
          try {
            $url = $null
            for ($i = 0; $i -lt 60 -and -not $url; $i++) {
              Start-Sleep -Seconds 1
              $line = Get-Content $out -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($line) { $url = ($line | ConvertFrom-Json).url }
            }
            if (-not $url) { throw 'the setup page gave no address' }
            $state = Invoke-RestMethod -Uri "${url}api/state" -UseBasicParsing
            $sources = @($state.connect.sources | ForEach-Object { $_.name }) -join ','
            $ais = @($state.ais) -join ','
            Write-Host "system $($state.system), Sources $sources, AIs $ais"
            if ($state.system -ne 'windows') { throw "the page words itself for $($state.system)" }
            if ($sources -ne 'wilma,gmail,ai,myclub') { throw "the page lists $sources" }
            if ($ais -ne 'gateway,codex,claude') { throw "the page offers $ais" }
          } finally {
            Stop-Process -Id $page.Id -Force -ErrorAction SilentlyContinue
          }
      - name: A second install downloads and installs nothing
        run: |
          $watched = @("$env:INSTALLED\runtime", "$env:INSTALLED\app\.venv\Scripts\python.exe",
                       "$env:INSTALLED\app\.venv\parent-recap-packages.txt")
          $before = $watched | ForEach-Object { (Get-Item $_).LastWriteTimeUtc.Ticks }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File $env:PARENT_RECAP *>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "exited with $LASTEXITCODE" }
          Write-Host $out
          if ($out -match 'Downloading|Installing') { throw 'the second install downloaded or installed something' }
          if ($out -notmatch 'up to date') { throw 'no word that the packages are up to date' }
          $after = $watched | ForEach-Object { (Get-Item $_).LastWriteTimeUtc.Ticks }
          if (Compare-Object $before $after) { throw 'the second install changed the runtimes or the venv' }
      # As the setup page's Wilma step installs it, from npm, with the program's own Node.
      - name: The wilma CLI installs and runs on the program's own Node
        run: |
          $py = "$env:INSTALLED\app\.venv\Scripts\python.exe"
          & $py -c "import sys; from family_brief import setup_wilma; r = setup_wilma.install(); print(r); sys.exit(r != 'installed')"
          if ($LASTEXITCODE -ne 0) { throw "the wilma CLI didn't install" }
          & $py -c "import subprocess, sys; from family_brief import own_node, setup_wilma; c = own_node.wilma(); print(c, setup_wilma.installed_version()); sys.exit(subprocess.run([*c, '--help'], env=own_node.wilma_env()).returncode)"
          if ($LASTEXITCODE -ne 0) { throw 'wilma --help failed' }
          # The town list the page searches comes with the CLI.
          & $py -c "import sys; from family_brief import setup_wilma; t = setup_wilma.tenants(); print(len(t or [])); sys.exit(not t)"
          if ($LASTEXITCODE -ne 0) { throw "the wilma CLI came without Wilma's town list" }
      # What setup leaves (a config, a secret in Credential Manager, the evening tasks in Task
      # Scheduler, the wilma CLI above), then uninstall run from the installed program, as a family
      # runs it: the program and its Python go once it has ended, from a hidden PowerShell. The
      # runner's output is a pipe in the PC's code page, as an agent's is, with no ✅ or ❌ (#380).
      - name: Uninstall leaves no task, credential or folder of Parent Recap's
        run: |
          $pr = "$env:INSTALLED\app\.venv\Scripts\parent-recap.exe"
          $py = "$env:INSTALLED\app\.venv\Scripts\python.exe"
          New-Item -ItemType Directory -Force "$HOME\.family" | Out-Null
          $config = "kids:`n- name: Mia`ngmail:`n  username: parent@example.com`nemail:`n  to: [parent@example.com]`nweekend_events:`n  enabled: true`n"
          [IO.File]::WriteAllText("$HOME\.family\config.yaml", $config)
          & $py -c "from family_brief import gateway, install_record; from family_brief.system import secrets; secrets.put(gateway.ACCOUNT, 'sk-ci-not-a-real-key'); install_record.add('keychain', gateway.ACCOUNT)"
          if ($LASTEXITCODE -ne 0) { throw "the Gateway Key wasn't stored" }
          & $pr schedule install
          if ($LASTEXITCODE -ne 0) { throw 'schedule install failed' }
          if (@(Get-ScheduledTask -TaskPath '\' | Where-Object { $_.TaskName -like 'Parent Recap *' }).Count -ne 2) { throw 'no tasks to remove' }

          $out = & $pr uninstall --confirm --remove-archive | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "uninstall exited with $code" }
          if ($out -notmatch 'The program goes once uninstall has ended') { throw 'no word that the program goes once uninstall has ended' }
          for ($i = 0; $i -lt 90 -and (Test-Path -LiteralPath $env:INSTALLED); $i++) { Start-Sleep -Seconds 1 }

          $left = @(
            Get-ScheduledTask -TaskPath '\' | Where-Object { $_.TaskName -like 'Parent Recap *' } | ForEach-Object { "task $($_.TaskName)" }
            cmdkey /list | Select-String 'Parent Recap/' | ForEach-Object { "credential $($_.Line.Trim())" }
            @($env:INSTALLED, "$HOME\.family", "$HOME\ParentRecap") | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { "folder $_" }
          )
          if ($left.Count -ne 0) { throw "left behind: $($left -join '; ')" }
