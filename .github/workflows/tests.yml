name: tests

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main, refactor]
  # The release workflow calls this before publishing a tag.
  workflow_call:

jobs:
  test:
    # macOS is the platform Parent Recap supports, and Actions minutes are free on a
    # public repo, so every run (PRs, main, tags) is on macOS (ADR 0002). The windows
    # job below only checks the program as the Windows version is built (ADR 0019).
    runs-on: macos-latest
    # The suite takes about 5 minutes. A hung test fails the job here instead of holding a
    # macOS runner for GitHub's 6-hour limit (#216).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # A python-build-standalone Python, the kind install.sh gives families. test_install.py's
      # stand-in pinned Python is a copy of it, which a python.org framework build can't stand in for.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Python
        run: |
          uv python install 3.13
          uv venv --seed --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # As install.sh installs: prebuilt packages only, at the pinned versions, with the google
      # extra a Google Calendar Household gets.
      - name: Install
        # Quoted as a block: in plain YAML, the colon and space after `:all:` would start a mapping.
        run: |
          python -m pip install --only-binary :all: -c constraints.txt -e '.[test,google]'
      # This runner is an Apple Silicon Mac. The check covers Intel Macs too.
      - name: Check every pinned package has a wheel for both kinds of Mac
        run: python ../scripts/check_wheels.py
      # Includes the version-consistency check (tests/test_version.py).
      - name: Test
        run: python -m pytest

  windows:
    # Every test that doesn't need macOS, so maintainers learn on every push whether the program
    # still works on Windows (ADR 0019). Tests marked `macos` skip themselves here.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      # The program reads and writes its files as UTF-8 without saying so, which Python on Windows
      # does only in UTF-8 mode.
      PYTHONUTF8: "1"
    steps:
      # The golden files and fixtures keep the repo's line endings, as on macOS.
      - name: Keep line endings
        working-directory: .
        run: git config --global core.autocrlf false
      # The tests pin the local timezone to Helsinki (conftest.py's NOW) through time-machine, which
      # can't change it on Windows, where there is no time.tzset(). So the runner itself is set to
      # Helsinki, as a Finnish family's PC is.
      - name: Helsinki time
        working-directory: .
        # Not bash: Git Bash would turn the /s switch into a path.
        shell: pwsh
        run: tzutil /s "FLE Standard Time"
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Python
        run: |
          uv python install 3.13
          uv venv --seed --python 3.13
          cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
      - name: Install
        run: |
          python -m pip install --only-binary :all: -c constraints.txt -e '.[test,google]'
      - name: Test
        run: python -m pytest

  windows-install:
    # install.ps1 on a clean Windows PC, from this checkout, with the real downloads (ADR 0019).
    # Windows PowerShell 5.1, which is what runs the line families paste.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      PARENT_RECAP: ${{ github.workspace }}\install.ps1
    steps:
      - uses: actions/checkout@v7
      - name: Where it installs
        run: Add-Content $env:GITHUB_ENV "INSTALLED=$env:LOCALAPPDATA\ParentRecap" -Encoding utf8
      # Prints the published line for a pin that doesn't match, so a bump can copy it.
      - name: The pinned Python and Node are the ones their projects published
        run: |
          $ps1 = Get-Content install.ps1 -Raw
          function Pin([string]$Name) {
            if ($ps1 -notmatch ('(?m)^\s*\$' + $Name + " = '([^']*)'")) { throw "install.ps1 pins no $Name" }
            return $Matches[1]
          }
          $py = Pin PythonVersion; $build = Pin PythonBuild; $node = Pin NodeVersion
          $pins = @(
            @{ List = "https://github.com/astral-sh/python-build-standalone/releases/download/$build/SHA256SUMS"
               File = "cpython-$py+$build-x86_64-pc-windows-msvc-install_only.tar.gz"; Pinned = Pin PythonSha256 },
            @{ List = "https://nodejs.org/dist/v$node/SHASUMS256.txt"
               File = "node-v$node-win-x64.zip"; Pinned = Pin NodeSha256 })
          $wrong = 0
          foreach ($p in $pins) {
            Invoke-WebRequest $p.List -OutFile sums.txt -UseBasicParsing
            $line = Get-Content sums.txt | Where-Object { $_.Trim() -match ('\s\*?' + [regex]::Escape($p.File) + '$') }
            if (-not $line -or ($line -split '\s+')[0] -ne $p.Pinned) {
              Write-Host "$($p.File): install.ps1 pins $($p.Pinned), $($p.List) says: $line"
              $wrong++
            }
          }
          exit $wrong
      - name: A download that fails says so and leaves nothing half there
        run: |
          (Get-Content install.ps1 -Raw) -replace "PythonReleases = '[^']*'", "PythonReleases = 'https://github.com/kinlace/no-such-release'" |
            Set-Content install-offline.ps1 -Encoding ascii
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File install-offline.ps1 *>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 1) { throw "exited with $code, not 1" }
          if ($out -notmatch "couldn't download its Python") { throw 'no message about the download' }
          if (Get-ChildItem "$env:INSTALLED\runtime" -Filter 'python-*') { throw 'a Python was left behind' }
          Remove-Item install-offline.ps1
          exit 0  # the install's own exit code of 1 was the one expected
      - name: The install picks up from there
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File $env:PARENT_RECAP
          if ($LASTEXITCODE -ne 0) { throw "exited with $LASTEXITCODE" }
          Get-Content "$env:INSTALLED\logs\*.log" -Tail 20
      - name: The installed program runs on its own Python and Node
        run: |
          $py = "$env:INSTALLED\app\.venv\Scripts\python.exe"
          & "$env:INSTALLED\app\.venv\Scripts\parent-recap.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'parent-recap --help failed' }
          & $py -c "import sys; from family_brief import own_node; n = own_node.node(); print(n, own_node.npm()); sys.exit(n is None or own_node.npm() is None)"
          if ($LASTEXITCODE -ne 0) { throw "the program doesn't find its own Node" }
          & $py -c "import sys; print(sys._base_executable); sys.exit('ParentRecap' not in sys._base_executable)"
          if ($LASTEXITCODE -ne 0) { throw "the venv isn't on Parent Recap's own Python" }
      - name: A second install downloads and installs nothing
        run: |
          $watched = @("$env:INSTALLED\runtime", "$env:INSTALLED\app\.venv\Scripts\python.exe",
                       "$env:INSTALLED\app\.venv\parent-recap-packages.txt")
          $before = $watched | ForEach-Object { (Get-Item $_).LastWriteTimeUtc.Ticks }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File $env:PARENT_RECAP *>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "exited with $LASTEXITCODE" }
          Write-Host $out
          if ($out -match 'Downloading|Installing') { throw 'the second install downloaded or installed something' }
          if ($out -notmatch 'up to date') { throw 'no word that the packages are up to date' }
          $after = $watched | ForEach-Object { (Get-Item $_).LastWriteTimeUtc.Ticks }
          if (Compare-Object $before $after) { throw 'the second install changed the runtimes or the venv' }
